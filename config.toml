# PlayPanel settings
# Edit this file, then restart PlayPanel to apply changes.

[layout]
# Album artwork size in pixels.
artwork_size = 460

# Maximum width of the whole panel in pixels.
panel_max_width = 1100

# Space between the record and song information in pixels.
panel_gap = 48

[appearance]
# Main page background.
background_color = "#111111"

# Main text color.
text_color = "#ffffff"

# Accent color used by the status indicator.
accent_color = "#ffffff"

[text]
# CSS font-size values. clamp() is supported by modern browsers.
title_size = "clamp(2.4rem, 5vw, 5rem)"
artist_size = "clamp(1.4rem, 2.5vw, 2.2rem)"
album_size = "1rem"

[behavior]
# How often the browser checks for updated song information.
poll_interval_ms = 1000
