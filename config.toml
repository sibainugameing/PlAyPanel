# PlayPanel settings
# Edit this file, then restart PlayPanel.

[server]
host = "0.0.0.0"
port = 8765

[layout]
# Album artwork diameter in pixels.
artwork_size = 520
# Maximum width of the whole panel.
panel_max_width = 1180
# Space between record and song information.
panel_gap = 70

[background]
# artwork_blur / preset / rgb
mode = "artwork_blur"
preset = "black"
rgb = "8, 8, 8"
artwork_opacity = 0.46
artwork_blur = 52

[appearance]
background_color = "#080808"
text_color = "#f5f5f5"
muted_color = "rgba(245, 245, 245, 0.58)"

[typography]
title_size = "clamp(2.8rem, 5.6vw, 6rem)"
artist_size = "clamp(1.35rem, 2.25vw, 2.15rem)"
album_size = "1rem"

[animation]
enabled = true
record_rotation_enabled = true
record_rotation_speed = 2.0
record_change_enabled = true
record_change_duration = 1200
record_change_distance = 105
record_change_rotation = 10.0
info_change_enabled = true
info_change_duration = 650
info_change_distance = 10
easing = "cubic-bezier(0.25, 0.85, 0.3, 1)"

[behavior]
poll_interval_ms = 1000
artwork_retry_interval_ms = 3000

[lyrics]
# Automatically fetch missing lyrics from LRCLIB and cache them locally.
enabled = true
cache_dir = "lyrics_cache"
# Oldest least-recently-used entries are removed above this count.
cache_max_entries = 500
timeout_seconds = 8.0
# Retry tracks that previously had no lyrics after this many seconds.
negative_cache_ttl_seconds = 3600.0
visible_lines = 5
current_line_size = "2.4rem"
side_line_size = "1.15rem"

# Positive values make the displayed lyric position later.
# Example: 0.5 = +0.5 seconds, -0.5 = -0.5 seconds.
sync_offset_seconds = 0.0

# Current lyric shown at the bottom of the album/track screen.
bottom_enabled = true
# Default bottom lyric size.
bottom_font_size = "clamp(1.08rem, 1.7vw, 1.34rem)"
bottom_max_width = "920px"
bottom_opacity = 0.92
bottom_animation_enabled = true
bottom_animation_duration = 520
bottom_animation_distance = 10

[display]
clock_enabled = true
screen_blank_enabled = true
screen_blank_timeout_minutes = 10
