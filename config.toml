# PlayPanel settings
# Edit this file, then restart PlayPanel.

[server]
host = "0.0.0.0"
port = 8765

[layout]
# Album artwork diameter in pixels.
artwork_size = 520

# Maximum width of the whole panel.
panel_max_width = 1180

# Space between record and song information.
panel_gap = 70

[appearance]
background_color = "#080808"
text_color = "#f5f5f5"
muted_color = "rgba(245, 245, 245, 0.58)"

[typography]
title_size = "clamp(2.8rem, 5.6vw, 6rem)"
artist_size = "clamp(1.35rem, 2.25vw, 2.15rem)"
album_size = "1rem"

[animation]
# Master switch for all PlayPanel animations.
enabled = true

# Continuous vinyl rotation while the player is playing.
record_rotation_enabled = true
# Full revolutions per minute.
record_rotation_speed = 2.0

# Record-to-record slide when the track changes.
record_change_enabled = true
# Duration in milliseconds. Slower gives the exchange more breathing room.
record_change_duration = 1200
# Horizontal travel distance as a percentage of the record stage.
record_change_distance = 105
# Additional rotation in degrees during the exchange.
record_change_rotation = 10.0

# Song information fade/slide when the track changes.
info_change_enabled = true
# Duration in milliseconds.
info_change_duration = 650
# Vertical travel distance in pixels.
info_change_distance = 10

# CSS easing curve used by the change animations.
easing = "cubic-bezier(0.25, 0.85, 0.3, 1)"

[behavior]
# Browser refresh interval for metadata.
poll_interval_ms = 1000
