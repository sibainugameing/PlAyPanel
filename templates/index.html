<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PlayPanel</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body
  style="--artwork-size: {{ settings.artwork_size }}px;
         --panel-max-width: {{ settings.panel_max_width }}px;
         --panel-gap: {{ settings.panel_gap }}px;
         --background-color: {{ settings.background_color }};
         --text-color: {{ settings.text_color }};
         --accent-color: {{ settings.accent_color }};
         --title-size: {{ settings.title_size }};
         --artist-size: {{ settings.artist_size }};
         --album-size: {{ settings.album_size }};"
>
  <main class="panel">
    <section class="visual" aria-label="ジャケット">
      <div class="record">
        <div class="record-label">
          <img id="artwork" class="artwork" alt="ジャケット画像" hidden>
        </div>
        <div class="record-hole" aria-hidden="true"></div>
      </div>
    </section>

    <section class="info">
      <p id="status" class="status">待機中</p>
      <h1 id="title">---</h1>
      <p id="artist" class="artist">---</p>
      <p id="album" class="album">---</p>
    </section>
  </main>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
