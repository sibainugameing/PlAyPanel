<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PlayPanel</title>
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="panel">
    <section class="visual" aria-label="ジャケット">
      <div class="record">
        <div class="record-label">
          <img id="artwork" class="artwork" alt="ジャケット画像" hidden>
        </div>
        <div class="record-hole" aria-hidden="true"></div>
      </div>
    </section>

    <section class="info">
      <p id="status" class="status">待機中</p>
      <h1 id="title">---</h1>
      <p id="artist" class="artist">---</p>
      <p id="album" class="album">---</p>
    </section>
  </main>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
