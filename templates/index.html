<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="{{ config.background_color }}">
  <title>PlayPanel</title>
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/backgrounds.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/lyrics.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/record-layers.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/player.css') }}">
  <style>
    .record-stage { overflow: visible; border-radius: 50%; }
    .record-progress {
      position: absolute; inset: 0; z-index: 8; width: 100%; height: 100%;
      display: block; overflow: hidden; pointer-events: none; opacity: 0;
      transform: rotate(-90deg); transform-origin: 50% 50%; transition: opacity 500ms ease;
    }
    .record-progress__value {
      fill: none; stroke: rgba(255, 255, 255, 0.98); stroke-width: 1.25; stroke-linecap: round;
      filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.38)); transition: stroke-dashoffset 180ms linear;
    }
    .record-progress.is-available { opacity: 1; }
    .record-progress.is-complete .record-progress__value {
      stroke-width: 1.35; filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.55));
    }
    .progress-time {
      margin: 0 0 14px; color: rgba(255, 255, 255, 0.58); font-size: 0.92rem;
      font-weight: 600; line-height: 1; letter-spacing: 0.08em; font-variant-numeric: tabular-nums;
    }
    .record::after { display: none; }
  </style>
</head>
<body
  data-background-mode="{{ config.background_mode }}"
  style="
    --background-rgb: {{ config.background_rgb }};
    --background-artwork-opacity: {{ config.background_artwork_opacity }};
    --background-artwork-blur: {{ config.background_artwork_blur }}px;
    --artwork-size: {{ config.artwork_size }}px;
    --panel-max-width: {{ config.panel_max_width }}px;
    --panel-gap: {{ config.panel_gap }}px;
    --background-color: {{ config.background_color }};
    --text-color: {{ config.text_color }};
    --muted-color: {{ config.muted_color }};
    --title-size: {{ config.title_size }};
    --artist-size: {{ config.artist_size }};
    --album-size: {{ config.album_size }};
    --record-change-duration: {{ config.record_change_duration }}ms;
    --record-change-distance: {{ config.record_change_distance }}%;
    --record-change-rotation: {{ config.record_change_rotation }}deg;
    --info-change-duration: {{ config.info_change_duration }}ms;
    --info-change-distance: {{ config.info_change_distance }}px;
    --animation-easing: {{ config.animation_easing }};
    --lyrics-current-size: {{ config.lyrics_current_size }};
    --lyrics-side-size: {{ config.lyrics_side_size }};
  "
>
  {% if config.clock_enabled %}
  <time id="clock" class="clock" aria-label="現在時刻">--:--</time>
  {% endif %}

  <main class="panel" aria-live="polite">
    <section class="visual" aria-label="アルバムアート">
      <div class="record-stage">
        <div class="record-shadow"></div>

        <div class="record-layer record-layer--active" data-record-layer="0" aria-hidden="false">
          <div class="record">
            <div class="record-grooves"></div>
            <div class="record-label">
              <img class="artwork" alt="アルバムアート" hidden>
              <div class="label-fallback" aria-hidden="true">PLAY</div>
            </div>
          </div>
        </div>

        <div class="record-layer" data-record-layer="1" aria-hidden="true">
          <div class="record">
            <div class="record-grooves"></div>
            <div class="record-label">
              <img class="artwork" alt="アルバムアート" hidden>
              <div class="label-fallback" aria-hidden="true">PLAY</div>
            </div>
          </div>
        </div>

        <svg id="record-progress" class="record-progress" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
          <circle id="record-progress__value" class="record-progress__value" cx="50" cy="50" r="49.375" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"></circle>
        </svg>
      </div>
    </section>

    <section class="info">
      <div class="eyebrow">
        <span class="status-dot" aria-hidden="true"></span>
        <span id="status">待機中</span>
      </div>

      <div class="track-copy">
        <p class="now-playing">NOW PLAYING</p>
        <p id="progress-time" class="progress-time" aria-label="再生時間">0:00 / --:--</p>
        <h1 id="title">---</h1>
        <p id="artist" class="artist">---</p>
        <p id="album" class="album">---</p>
      </div>

      <section class="player-card" aria-label="簡易再生情報">
        <div class="player-card__artwork">
          <img id="player-artwork" src="" alt="アルバムアート" hidden>
          <div class="player-card__artwork-fallback" aria-hidden="true">PLAY</div>
        </div>
        <div class="player-card__main">
          <div class="player-card__copy">
            <p class="player-card__label">NOW PLAYING</p>
            <h2 id="clock-player-title">---</h2>
            <p id="clock-player-artist" class="artist">---</p>
            <p id="clock-player-album" class="album">---</p>
          </div>
          <div class="player-card__progress">
            <div class="player-card__time">
              <span id="clock-player-progress-time" aria-label="再生時間">0:00 / --:--</span>
              <span id="player-client-name" class="player-card__client">AirPlay</span>
            </div>
            <div class="player-card__progress-track" aria-hidden="true">
              <div id="player-progress__value" class="player-card__progress-value"></div>
            </div>
          </div>
        </div>
      </section>

      <div class="lyrics-panel" id="lyrics-panel" hidden aria-label="歌詞">
        <div id="lyrics-lines" class="lyrics-lines"></div>
        <p id="lyrics-status" class="lyrics-status"></p>
      </div>

      <div id="now-lyric-bar" class="now-lyric-bar" hidden aria-live="polite" aria-label="現在の歌詞">
        <span class="now-lyric-bar__mark" aria-hidden="true">♪</span>
        <span id="now-lyric" class="now-lyric-bar__text"></span>
      </div>

      <div class="info-line" aria-hidden="true"></div>
      <p class="product-name">PlayPanel</p>
    </section>
  </main>

  {% if config.screen_blank_enabled %}
  <div id="screen-blank" class="screen-blank" aria-hidden="true"></div>
  {% endif %}

  {% if config.clock_enabled %}
  <button id="view-mode-toggle" class="view-mode-toggle" type="button" aria-label="表示モードを切り替え">
    時計モード
  </button>
  {% endif %}

  <script>
    window.PLAYPANEL_CONFIG = {
      pollIntervalMs: {{ config.poll_interval_ms }},
      artworkRetryIntervalMs: {{ config.artwork_retry_interval_ms }},
      lyrics: {
        enabled: {{ 'true' if config.lyrics_enabled else 'false' }},
        visibleLines: {{ config.lyrics_visible_lines }},
        syncOffsetSeconds: {{ config.lyrics_sync_offset_seconds }},
        bottomEnabled: {{ 'true' if config.lyrics_bottom_enabled else 'false' }},
        bottomFontSize: {{ config.lyrics_bottom_font_size|tojson }},
        bottomMaxWidth: {{ config.lyrics_bottom_max_width|tojson }},
        bottomOpacity: {{ config.lyrics_bottom_opacity }},
        bottomAnimationEnabled: {{ 'true' if config.lyrics_bottom_animation_enabled else 'false' }},
        bottomAnimationDuration: {{ config.lyrics_bottom_animation_duration }},
        bottomAnimationDistance: {{ config.lyrics_bottom_animation_distance }},
      },
      display: {
        clockEnabled: {{ 'true' if config.clock_enabled else 'false' }},
        screenBlankEnabled: {{ 'true' if config.screen_blank_enabled else 'false' }},
        screenBlankTimeoutMinutes: {{ config.screen_blank_timeout_minutes }},
      },
      animation: {
        enabled: {{ 'true' if config.animations_enabled else 'false' }},
        recordRotationEnabled: {{ 'true' if config.record_rotation_enabled else 'false' }},
        recordRotationSpeed: {{ config.record_rotation_speed }},
        recordChangeEnabled: {{ 'true' if config.record_change_enabled else 'false' }},
        infoChangeEnabled: {{ 'true' if config.info_change_enabled else 'false' }},
      },
    };
  </script>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  <script src="{{ url_for('static', filename='js/background.js') }}"></script>
  <script src="{{ url_for('static', filename='js/lyrics.js') }}"></script>
  <script src="{{ url_for('static', filename='js/progress.js') }}"></script>
</body>
</html>
